<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信小程序 · 玻璃拟态界面原型</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 48px 20px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 12% -8%, #6d5bd0 0%, transparent 55%),
      radial-gradient(900px 500px at 88% 8%, #2a9df4 0%, transparent 50%),
      radial-gradient(800px 600px at 50% 110%, #ff6b9d 0%, transparent 55%),
      #0b0d17;
    color: #eef1f8;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: .5px; }
  .sub { color: #a9b2c8; font-size: 14px; margin-bottom: 34px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  a.card {
    display: block; text-decoration: none; color: inherit; padding: 22px 22px 18px;
    border-radius: 20px; position: relative; overflow: hidden;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 10px 34px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.16);
    transition: transform .22s ease, border-color .22s ease, background .22s ease;
  }
  a.card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.11); }
  a.card .tag {
    display: inline-block; font-size: 11px; letter-spacing: 1px; padding: 3px 9px;
    border-radius: 999px; background: rgba(255,255,255,.14); color: #cfd6ea; margin-bottom: 12px;
  }
  a.card h2 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
  a.card p { margin: 0; font-size: 13px; line-height: 1.6; color: #a9b2c8; }
  footer { margin-top: 40px; font-size: 12px; color: #7b8499; line-height: 1.9; }
  footer a { color: #9fb4e0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>玻璃拟态界面原型</h1>
  <div class="sub">微信小程序改造方案 · 选校与动态主题引擎</div>

  <div class="grid">
    <a class="card" href="mockup.html">
      <span class="tag">MAIN</span>
      <h2>主界面原型</h2>
      <p>玻璃拟态卡片、磨砂层次、背景光晕的完整主页面效果。</p>
    </a>
    <a class="card" href="picker.html">
      <span class="tag">PICKER</span>
      <h2>学校选择器</h2>
      <p>院校列表、搜索与当前选择状态，含校徽驱动的配色。</p>
    </a>
    <a class="card" href="themes.html">
      <span class="tag">THEME</span>
      <h2>动态主题引擎</h2>
      <p>按校徽提取主色，实时生成整套玻璃拟态配色方案。</p>
    </a>
    <a class="card" href="layering-test.html">
      <span class="tag">TEST</span>
      <h2>层级叠加测试</h2>
      <p>验证多层模糊叠加时的渲染表现与性能开销。</p>
    </a>
  </div>

  <footer>
    源码仓库：<a href="https://github.com/yuchengh898-wq/glass-mockup">yuchengh898-wq/glass-mockup</a><br>
    小程序源码位于 <code>pages/</code>、<code>theme/</code>、<code>wxss/</code> 目录
  </footer>
</div>
</body>
</html>
